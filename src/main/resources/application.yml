spring:
  application:
    name: order-management-service
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/orderdb}
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
  flowable:
    database-schema-update: true
  security:
    user:
      name: admin
      password: admin123

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

orderStatusConcurrency: 3
provisioningConcurrency: 3

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

logging:
  level:
    com.mohit.om.service: DEBUG
    org.flowable: INFO
    org.springframework.kafka: INFO
